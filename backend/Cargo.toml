[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapter-postgres",
    "crates/adapter-auth",
    "crates/adapter-http",
    "crates/server",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
adapter-postgres = { path = "crates/adapter-postgres" }
adapter-auth = { path = "crates/adapter-auth" }
adapter-http = { path = "crates/adapter-http" }

anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
jsonwebtoken = "9"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
